<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2569d9" />
      <stop offset="100%" stop-color="#003a8d" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#003a8d" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Gradient circle -->
  <circle cx="32" cy="32" r="30" fill="url(#brandGradient)" filter="url(#softShadow)" />

  <!-- Letter A -->
  <text
    x="32"
    y="45"
    text-anchor="middle"
    font-family="'Space Grotesk', system-ui, -apple-system, sans-serif"
    font-size="36"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-1"
  >A</text>
</svg>